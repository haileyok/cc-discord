display_information:
  name: claude-slack-bridge
  description: Drive trusted Polytoken agent sessions from a private Slack workspace.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: claude-slack-bridge
    always_online: true
  slash_commands:
    - command: /agent
      description: Start or control a Polytoken agent session
      usage_hint: "start / stop / list / help"
      should_escape: false
  shortcuts:
    - name: Agent
      type: global
      callback_id: agent
      description: Open claude-slack-bridge agent controls
settings:
  socket_mode_enabled: true
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - app_mention
      - reaction_added
      - reaction_removed
      - agent_session_stopped
  incoming_webhooks:
    incoming_webhooks_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:read
      - channels:manage
      - channels:history
      - chat:write
      - commands
      - files:read
      - files:write
      - reactions:read
      - reactions:write
      - users:read
      - groups:read
      - groups:write
      - groups:history
# There is intentionally no oauth_config.scopes.user section: the bridge
# never requests or uses a user token to impersonate a human.
